[workspace]
name = "object-search-exploration"
version = "0.1.0"
description = "Exemplar-based object search: draw one box, find every other instance"
authors = ["Enrique G. Ortiz <ortizeg@gmail.com>"]
channels = ["conda-forge"]
# osx-arm64 is the development machine; linux-64 is the CI runner. Both must be in the
# lock so CI can install with --locked instead of silently re-solving.
platforms = ["osx-arm64", "linux-64"]

# --------------------------------------------------------------------------- dependencies
# conda-forge for anything with native/binary components, so one solver owns the whole
# native graph and the numpy ABI is consistent across cv2 / scipy / sklearn.
[dependencies]
python = "3.12.*"
numpy = ">=2.0,<3"
# The `<5` upper bound is load-bearing, not stylistic: conda-forge `opencv 5.0.0` is
# published with no per-Python build string (no `py312`) on any subdir, i.e. NO Python
# bindings. An unbounded spec can resolve to 5.x and produce an environment that installs
# cleanly and then raises ModuleNotFoundError: cv2 at first import.
# `headless` avoids dragging all of Qt6 in for a FastAPI/CLI app that never calls imshow.
# tests/test_environment.py asserts `import cv2` really works, so a future bump cannot
# silently remove the bindings again.
opencv = { version = ">=4.13,<5", build = "headless*" }
scipy = ">=1.14"           # GMM calibration, watershed, connected components
scikit-learn = ">=1.5"     # GaussianMixture for the gmm calibration strategy
matplotlib-base = ">=3.9"  # -base avoids pulling a GUI toolkit
pillow = ">=10"

[pypi-dependencies]
# The project itself. hatchling builds it from pyproject.toml, so this must be PyPI-side.
object-search = { path = ".", editable = true }
# Exact pin, deliberately. onnxruntime 1.23.2 is the last release whose macOS cp312 wheel
# carries the `macosx_13_0_arm64` tag; 1.24.1+ moved to `macosx_14_0_arm64`, which does not
# satisfy pixi's default `__osx 13.0` virtual package for osx-arm64 and fails the solve.
# This exact version is proven to resolve by the sibling project's lockfile.
# TODO(phase-1-followup): conda-forge `onnxruntime >=1.26,<1.27` sidesteps the wheel-tag
# problem entirely (conda packages use `__osx >=11.0`), puts the whole native graph under a
# single solver, and enables the CoreML execution provider on osx-arm64. Note that 1.23.x
# was NEVER published to conda-forge, so that move is a version bump too, not a channel
# swap. Deliberately deferred until after Phase 1 is green; changing this pin requires
# re-verifying `pixi install` on osx-arm64.
onnxruntime = "==1.23.2"
pydantic = ">=2.9"
loguru = ">=0.7"
fastapi = ">=0.115"
uvicorn = ">=0.32"
python-multipart = ">=0.0.12"  # required by FastAPI for file upload (API-06)
# 1.3.4 is a security release (blocklist for security-sensitive `_target_` in instantiate);
# conda-forge is stuck on 1.3.2, so PyPI is the correct source here.
hydra-core = ">=1.3.4,<1.4"    # CLI/benchmark entrypoint ONLY
typer = ">=0.12"               # cli.py
huggingface-hub = ">=0.26"     # fetch-models downloads

[feature.dev.pypi-dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.15"
mypy = ">=1.13"
pre-commit = ">=4.0"
httpx = ">=0.28"  # needed by fastapi's TestClient

[feature.dev.dependencies]
onnx = ">=1.22.0,<2"

# Documentation site. mkdocs-material renders the existing docs/ Markdown tree into a themed,
# searchable static site (dark mode, syntax highlighting, nav). It is pure-Python (PyPI wheel,
# no native components), so it joins the DEFAULT environment without touching the conda native
# graph or the onnxruntime pin — which is what lets `pixi run docs` work with no `-e` flag.
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"

# UI screenshot capture. Playwright drives a headless Chromium against a running `pixi run
# serve` to script the real canvas interaction (select method, drag an exemplar box, capture
# the results + diagnostics overlay). Quarantined in its own `capture` environment: it pulls a
# ~150 MB Chromium binary (via `pixi run -e capture playwright-install`) and is a one-off
# maintainer action — the rendered PNGs are committed, so nobody browsing the docs runs this.
[feature.capture.dependencies]
python = "3.12.*"

[feature.capture.pypi-dependencies]
playwright = ">=1.48"

# The FastSAM ONNX export needs Ultralytics, and therefore torch. Those are EXPORT-TIME-ONLY
# dependencies, quarantined in this feature so the DEFAULT runtime environment stays
# torch-free -- which makes the "ONNX Runtime for every learned model" constraint structural
# rather than something reviewers have to police. AGPL-3.0 (ultralytics) lives only here and
# never enters the default solve-group. Invoke with `pixi run -e export fetch-models --only
# fastsam-s`. This is a deviation from plan 01-01's single-environment manifest (see SUMMARY).
[feature.export.dependencies]
python = "3.12.*"
ultralytics = "*"
pytorch = "*"
torchvision = "*"
onnx = "*"
# OWLv2 export (Method 4) needs transformers. Apache-2.0, so no copyleft constraint -- it is
# export-time only purely because it pulls torch, which the runtime env deliberately excludes.
transformers = ">=4.40"
# torch.onnx.export's exporter imports onnxscript at call time (even the legacy path in torch 2.9+).
onnxscript = "*"

[environments]
default = { features = ["dev", "docs"], solve-group = "default" }
export = { features = ["export"] }
# Playwright + Chromium only — deliberately NOT in the default solve-group. Screenshot capture
# is a rare maintainer action against a running server; keeping it isolated means a browser
# toolchain never enters the runtime environment.
capture = { features = ["capture"] }

# Export-only tasks live under the `export` feature so they are runnable ONLY in the `export`
# environment (torch + ultralytics, AGPL-3.0). This keeps the AGPL exporter off the default
# task surface: `pixi run export-fastsam` in the runtime env has no such task.
[feature.export.tasks]
export-fastsam = { cmd = "python scripts/export_fastsam.py" }
export-owlv2 = { cmd = "python scripts/export_owlv2.py" }

# Capture-only tasks, runnable ONLY in the `capture` environment (Playwright + Chromium).
# `playwright-install` fetches the browser binary once; `capture-ui` drives a running server
# (start `pixi run serve` first) and writes the walkthrough screenshots into docs/assets/ui/.
[feature.capture.tasks]
playwright-install = { cmd = "playwright install chromium" }
capture-ui = { cmd = "python scripts/capture_ui.py" }

# --------------------------------------------------------------------------------- tasks
# These names are the contract CI invokes. Do not rename them.
[tasks]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/"
test = "pytest tests/ -v"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
fetch-models = "python -m object_search.cli fetch-models"
# Convert the research evaluation datasets (EVAL-21) into the gitignored datasets/ tree. CARPK is
# licence-gated: `fetch-datasets --list` prints where a human drops the archive first (D-08).
fetch-datasets = "python -m object_search.cli fetch-datasets"
serve = "uvicorn object_search.api.app:app --reload --port 8000"
# Documentation site (mkdocs-material). `docs` serves it locally with live-reload at
# http://127.0.0.1:8001; `docs-build` renders the static site into site/ (what CI publishes).
docs = "mkdocs serve --dev-addr 127.0.0.1:8001"
docs-build = "mkdocs build --strict"
samples = "python -m object_search.cli render-samples"
report = "python scripts/build_report.py"
# Render the committed research-dataset report table from the (gitignored, regenerable)
# docs/benchmark/research-results.json produced by run_research_sweep. Fails with an actionable
# message when that file is absent (the numbers depend on the licence-gated fetched archives).
report-research = "python scripts/build_research_report.py"
# Hydra's @hydra.main seizes sys.argv, so the benchmark CANNOT be a Typer subcommand
# (the Typer parser and Hydra's would both try to own argv). It is its own module entry
# point instead. `bench` runs the full sweep (needs fetched models); `bench-ci` runs the
# model-free chipset subset (ncc + classical sparse-geo) with no ONNX weights.
bench = "python -m object_search.eval.benchmark"
bench-ci = "python -m object_search.eval.benchmark ci=true"
# The RESEARCH sweep (EVAL-23/24): method x dataset x {1,3} x {val,test} over the fetched datasets/
# tree. Gated on fetch-datasets (+ fetched models for the learned methods), never in CI. Needs
# research_root + datasets on the CLI, e.g.:
#   pixi run bench-research research_root=datasets datasets=[rpine,fscd147,fscd_lvis,carpk]
bench-research = "python -m object_search.eval.benchmark --research"
# Render the committed, byte-identical charts + results.md from the last `bench` run (EVAL-06).
bench-charts = "python -m object_search.eval.charts"
synth = "python -m object_search.cli synth"
chipset = "python -m object_search.cli chipset"
textured = "python -m object_search.cli textured"
markers = "python -m object_search.cli markers"
